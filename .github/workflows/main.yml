name: Deploy via FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Versão estável para Laravel 12

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      - name: Sync files (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Caminho base informado no seu arquivo original
          server-dir: domains/escoladominical.andersonls.com.br/public_html/
          protocol: ftp
          port: 21
          # Garante que a pasta public/build gerada AGORA seja enviada
          # mesmo estando no .gitignore do repositório
